# Zocket example conf (matches the semantics of the old config.example.json)
recv_buffer_size 16k;
send_buffer_size 16k;
max_body 16m;
max_line_bytes 8k;
max_headers 32;
max_chunked_body 64k;
static_cache_entries 16;
static_cache_valid 1;
static_content_cache_max 16k;
connection_pool_max 1024;

server {
    location = /echo {
        content echo;
    }

    location /gzip {
        content echo;
        preaccess conditional_get;
        post_access cache_headers;
        log gzip;
        max_age 3600;
    }

    location /static {
        content static;
        root testdata;
        index index.html;
        autoindex on;
    }

    location = /health {
        return 200 "ok";
    }

    location = /old {
        return 301 "";
        add_header Location "/health";
    }

    location / {
        content echo;
    }
}
