# Zocket h2/TLS benchmark config: ECDSA cert + HTTP/2 over ALPN, echo
# endpoint on /. Loaded at compile time (-Dconfig=); the CLI --port
# overrides the listen port per run.
tls {
    cert "/tmp/opencode/bench-tls.crt";
    key "/tmp/opencode/bench-tls.key";
}

server {
    listen 8443;

    location / {
        content echo;
    }
}
