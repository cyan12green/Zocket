# Module-features benchmark config: one server exercising every module
# so a single ReleaseFast binary serves all benchmark cells.
server {
    # h1_echo cell: POST body echo (1 KB)
    location = /echo {
        content echo;
    }

    # headers cell: three header ops on the hot path
    location = /h {
        content echo;
        set_header X-A "1";
        add_header X-B "$remote_addr";
        remove_header X-Powered-By;
    }

    # auth cell: {SHA} htpasswd verification per request
    location = /auth {
        content echo;
        auth_basic "bench";
        auth_basic_user_file "testdata/bench-htpasswd";
    }

    # precompressed cell: .gz twin serving (falls through to static)
    location / {
        root bench/static;
        precompressed gz;
        content static;
        tcp_nopush on;
    }

    # cache_hit cell: proxy_cache in front of an origin Zocket (echo)
    location = /cached {
        proxy_cache on;
        proxy_cache_valid 3600;
        rewrite proxy_cache;
        rewrite proxy;
        proxy_pass 127.0.0.1:18901;
    }

    # proxy cell: raw reverse-proxy throughput (LB + shared health state on
    # every request), origin is a separate plain Zocket echo server
    location = /proxied {
        rewrite proxy;
        proxy_pass 127.0.0.1:18901;
    }

    # limit_req cell: pass-through limiter overhead (rate high enough that
    # nothing sheds; compares pure bucket-check cost)
    location = /limited {
        content echo;
        limit_req rate=1000000 burst=10000;
    }

    # ret cell: pre-serialised fixed response (fast path)
    location = /ret {
        return 200 "ok";
    }

    # named cell: try_files miss -> named-location fallback
    location = /named {
        root bench/static;
        try_files $uri @app;
    }
    location @app {
        return 200 "fallback";
    }

    # accel cell: origin answers with X-Accel-Redirect; the front serves
    # the internal file itself
    location /int/ {
        internal;
        content static;
        root bench/static;
    }
    location = /accel {
        rewrite proxy;
        proxy_pass 127.0.0.1:18901/accel;
        accel on;
    }

    # sub_filter cell: proxied 8 KB body rewritten per request
    location = /subf {
        rewrite proxy;
        proxy_pass 127.0.0.1:18901/sub;
        sub_filter "ORIGIN" "ZOCKET";
        sub_filter_once off;
    }

    # gzip cell: 8 KB static file compressed per request
    location = /gz {
        content static;
        root bench/static;
        gzip on;
    }

    # proxy_hide_header cell: strip one header from the proxied response
    location = /hide {
        rewrite proxy;
        proxy_pass 127.0.0.1:18901/hide;
        proxy_hide_header X-Powered-By;
    }
}
