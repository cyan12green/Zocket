# Origin for the module-features benchmark. Serves the echo endpoint the
# proxy/cache cells hit, plus the special responses the new cells need:
#   /       echo            (proxy + proxy_cache cells)
#   /accel  X-Accel-Redirect hand-off to /int/f8k (front serves the file)
#   /sub    static 8 KB marker body (sub_filter source)
#   /hide   fixed body plus X-Powered-By/X-Keep headers (proxy_hide_header)
server {
    listen 18901;

    location / {
        content echo;
    }

    location = /accel {
        return 200 "";
        add_header X-Accel-Redirect "/int/f8k";
    }

    location = /sub {
        content static;
        root bench/static;
    }

    location = /hide {
        return 200 "ok";
        add_header X-Powered-By "bench-origin";
        add_header X-Keep "yes";
    }
}
