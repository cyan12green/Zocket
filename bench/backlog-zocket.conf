# Backlog-features benchmark config: one server exercising every new
# module so a single ReleaseFast binary serves all benchmark cells.
server {
    # headers cell: three header ops on the hot path
    location = /h {
        content echo;
        set_header X-A "1";
        add_header X-B "$remote_addr";
        remove_header X-Powered-By;
    }

    # auth cell: {SHA} htpasswd verification per request
    location = /auth {
        content echo;
        auth_basic "bench";
        auth_basic_user_file "testdata/bench-htpasswd";
    }

    # precompressed cell: .gz twin serving (falls through to static)
    location / {
        root bench/static;
        precompressed gz;
        content static;
    }

    # cache_hit cell: proxy_cache in front of an origin Zocket (echo)
    location = /cached {
        proxy_cache on;
        proxy_cache_valid 3600;
        rewrite proxy_cache;
        rewrite proxy;
        proxy_pass 127.0.0.1:18901;
    }

    # limit_req cell: shed beyond rate=2000/s burst=100
    location = /limited {
        content echo;
        limit_req rate=2000 burst=100;
    }
}
