# Unified benchmark config: mirrors every Group-A cell + the LB cell.
server {
    location = /echo {
        content echo;
    }

    location / {
        root bench/static;
        precompressed gz;
        content static;
    }

    location = /h {
        content echo;
        set_header X-A "1";
        add_header X-B "$remote_addr";
        remove_header X-Powered-By;
    }

    location = /auth {
        content echo;
        auth_basic "bench";
        auth_basic_user_file "testdata/bench-htpasswd";
    }

    location = /limited {
        content echo;
        limit_req rate=1000000 burst=10000;
    }

    # cache_hit cell
    location = /cached {
        proxy_cache on;
        proxy_cache_valid 3600;
        rewrite proxy_cache;
        rewrite proxy;
        proxy_pass 127.0.0.1:18910;
    }

    # lb_rr cell: round-robin across the 4-origin pool
    location = /proxied {
        rewrite proxy;
        proxy_pass 127.0.0.1:18910;
        proxy_pass 127.0.0.1:18911;
        proxy_pass 127.0.0.1:18912;
        proxy_pass 127.0.0.1:18913;
    }
}
