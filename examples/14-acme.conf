# ──────────────────────────────────────────────────────────────
# 14-acme.conf — ACME auto-HTTPS (issuance + renewal)
# ──────────────────────────────────────────────────────────────
# This is a DEPLOYMENT TEMPLATE: the ACME exchange talks to a real CA
# (Let's Encrypt by default) and needs a public domain whose
# /.well-known/acme-challenge/ is reachable from the internet.
#
# Build:  zig build -Dconfig=examples/14-acme.conf run
# Validate (checks the cert files exist):  zig build -Dconfig=examples/14-acme.conf run -- --validate
#
# What the server does:
#   1. On startup the renewal daemon checks tls.cert; missing or under
#      30 days left -> one ACME v2 exchange (account, order, http-01
#      challenge, CSR finalize, download) and the chain + key are
#      written over the paths below.
#   2. It re-checks every 12 h; failures are logged and retried, the
#      running server is never disturbed. Restart (or --reload-hard)
#      to serve a freshly issued certificate.
#   3. The account key is generated on first use and reused
#      (account_key, or <cert>.acct.pem by default).
# ──────────────────────────────────────────────────────────────

# Serve the issued certificate. Until the first issuance these files may
# not exist yet; point them at a self-signed pair to bootstrap, or run
# with the placeholder paths once issuance has completed.
tls {
    cert /var/lib/zocket/example.com.pem;
    key  /var/lib/zocket/example.com.key;
}

acme {
    directory https://acme-v02.api.letsencrypt.org/directory;

    # Optional contact for expiry notices.
    contact mailto:ops@example.com;

    # Optional account key path (default: <tls.cert>.acct.pem, i.e.
    # /var/lib/zocket/example.com.pem.acct.pem here).
    account_key /var/lib/zocket/acme-account.pem;

    # Every domain gets a SAN in one certificate; the first is the CN.
    domain example.com;
    domain www.example.com;
}

server {
    listen 443;

    # http-01 challenge tokens are answered by the acme_challenge module
    # (content phase, like echo/static).
    location /.well-known/acme-challenge/ {
        content acme_challenge;
    }

    # Normal traffic.
    location / {
        content static;
        root /var/www/example.com;
        index index.html;
    }

    location = /health { return 200 "ok\n"; }
}

# Plain HTTP: keep the challenge reachable before TLS exists, and send
# everything else to HTTPS.
server {
    listen 80;

    location /.well-known/acme-challenge/ {
        content acme_challenge;
    }
    location / {
        return 301 "https://$host$request_uri";
    }
}
