# ──────────────────────────────────────────────────────────────
# 01-basics.conf — Minimal server: echo, health, fixed responses
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/01-basics.conf run
# Verify: curl http://localhost:8080/
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Echo: returns the request body as-is (useful for debugging)
    location = /echo {
        content echo;
    }

    # Health check: fixed 200 response (no module, zero overhead)
    location = /health {
        return 200 "ok";
    }

    # Redirect: 301 to a different path
    location = /old {
        return 301 "";
        add_header Location "/health";
    }

    # Plain response with a custom header
    location = /hello {
        return 200 "hello world\n";
        add_header X-Powered-By "zocket";
    }

    # Catch-all: everything else gets the echo handler
    location / {
        content echo;
    }
}
