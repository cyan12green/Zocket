# ──────────────────────────────────────────────────────────────
# 10-vhosts.conf — Virtual hosts with server_name matching
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/10-vhosts.conf run
# Test:   curl -H 'Host: example.com' http://localhost:8080/
#         curl -H 'Host: api.example.com' http://localhost:9090/
#         curl -H 'Host: anything' http://localhost:8080/
#
# Matching: exact name → longest wildcard → first server (default).
# Up to 16 server blocks supported. host_select on; is the default.
# ──────────────────────────────────────────────────────────────

# Named server: example.com on port 8080
server {
    listen 8080;
    server_name example.com;

    location / {
        content static;
        root testdata;
        index index.html;
    }
}

# API server: api.example.com + *.api.example.com on port 9090
server {
    listen 9090;
    server_name api.example.com;
    server_name *.api.example.com;      # wildcard subdomain

    location / {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        proxy_set_header Host "$host";
    }
}

# Catch-all: any unmatched Host → default response
server {
    listen 8080;

    location / {
        return 404 "no vhost matched\n";
    }
}
