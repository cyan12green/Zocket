# ──────────────────────────────────────────────────────────────
# 03-gzip.conf — Compression and conditional responses
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/03-gzip.conf run
# Test:   curl -H 'Accept-Encoding: gzip' http://localhost:8080/
#         curl -H 'If-Modified-Since: ...' http://localhost:8080/
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Gzip: transparent response compression (filter, runs after handler)
    location /api {
        content echo;
        gzip on;                     # bind gzip filter automatically
    }

    # Conditional GET: If-Modified-Since → 304 Not Modified
    location /cached {
        content static;
        root testdata;
        preaccess conditional_get;   # bind conditional_get handler
        max_age 60;                  # Cache-Control + ETag (binds cache_headers)
    }

    # Precompressed: serve .gz file if client supports gzip
    location /precompressed {
        content static;
        root testdata;
        precompressed gz;            # look for file.gz alongside file
    }

    location / {
        content echo;
        gzip on;
    }
}
