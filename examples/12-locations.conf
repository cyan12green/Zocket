# ──────────────────────────────────────────────────────────────
# 12-locations.conf — Named locations, internal files, silent drops
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/12-locations.conf run
# Test:
#   curl http://localhost:8080/hello.txt          # static hit
#   curl http://localhost:8080/missing            # try_files -> @app
#   curl http://localhost:8080/files/nope.txt     # 404 -> @notfound
#   curl http://localhost:8080/download           # accel: origin hands the
#                                                 # file back to /dl (internal)
#   curl http://localhost:8080/dl/hello.txt       # 404: internal-only
#   curl -v http://localhost:8080/bot-trap        # connection closed, no bytes
#
# Covers: `location @name`, `internal`, `return 444`, try_files fallback,
# error_page -> named location, and accel (X-Accel-Redirect).
# ──────────────────────────────────────────────────────────────

# ── Origin: pretends to authenticate and hands a download back ──
# (In real life this is your app; here it is a second local listener so
# the example runs end to end.)
server {
    listen 9000;

    location = /auth {
        return 200 "";                               # no body from the app
        add_header X-Accel-Redirect "/dl/hello.txt"; # actual file to serve
    }
}

server {
    listen 8080;

    # ── try_files with a named-location fallback (front controller) ──
    location / {
        content static;
        root testdata;
        try_files $uri @app;
    }
    location @app {
        content echo;
        add_header X-Served-By "@app";
    }

    # ── error_page targeting a named location (method preserved) ──
    location /files/ {
        content static;
        root testdata;
        error_page 404 = @notfound;
    }
    location @notfound {
        return 200 "custom 404 from @notfound\n";
        add_header X-Served-By "@notfound";
    }

    # ── internal: reachable only through internal redirects ──
    location /dl/ {
        internal;
        content static;
        root testdata;
    }

    # ── accel: honor the origin's X-Accel-Redirect and serve /dl/… ──
    # (the URI tail `/auth` is what the origin sees — proxy_pass rewriting)
    location = /download {
        rewrite proxy;
        proxy_pass 127.0.0.1:9000/auth;
        accel on;
    }

    # ── Silent drop (nginx `return 444`): no response bytes at all ──
    location = /bot-trap {
        return 444;
    }
}
