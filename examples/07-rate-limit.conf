# ──────────────────────────────────────────────────────────────
# 07-rate-limit.conf — Request rate limiting + connection limiting
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/07-rate-limit.conf run
# Test:   for i in $(seq 1 20); do curl -s -o /dev/null -w "%{http_code}\n" \
#           http://localhost:8080/api; done
#         → first 10 return 200, rest return 503
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Rate limit: 10 req/s per key, burst of 20
    location /api {
        content echo;
        limit_req rate=10 burst=20;
        # key = IP (default); response 503 on shed
    }

    # Tighter limit: 5 req/s, burst defaults to rate
    location /strict {
        content echo;
        limit_req rate=5;
    }

    # Connection limit: max 100 simultaneous connections per key
    location /download {
        content static;
        root testdata;
        limit_conn 100;
    }

    location / {
        content echo;
    }
}
