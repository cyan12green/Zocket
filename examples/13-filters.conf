# ──────────────────────────────────────────────────────────────
# 13-filters.conf — Response body filters
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/13-filters.conf run
# Test:
#   curl --compressed http://localhost:8080/gzip      # Content-Encoding: gzip
#   curl http://localhost:8080/sub                    # body rewritten
#   curl -H 'Accept-Encoding: br' -i http://localhost:8080/asset
#                                                     # .br twin if present
#   curl -H 'Accept-Encoding: gzip' -i http://localhost:8080/asset
#                                                     # .gz twin (testdata/demo.txt.gz)
#
# Covers: gzip, sub_filter (+ sub_filter_once), precompressed (gz/br/zstd).
# Filters run after every outcome — return templates, static files and
# proxied responses alike (prose bodies only).
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # ── gzip: compress a generated body ─────────────────────
    location = /gzip {
        return 200 "The quick brown fox jumps over the lazy dog, over and over, so the body is worth compressing. The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog.\n";
        gzip on;
    }

    # ── sub_filter: rewrite response text (first hit unless once off) ──
    location = /sub {
        return 200 "backend says: world, world, world\n";
        sub_filter "world" "zocket";
        sub_filter_once off;
        add_header X-Filtered "yes";
    }

    # ── precompressed: serve demo.txt.gz / demo.txt.br when accepted ──
    # (testdata/demo.txt has a committed .gz twin; add a .br twin next to
    #  it to exercise brotli-first serving.)
    location /asset {
        content precompressed;
        precompressed br;     # best-first among accepted encodings
        precompressed zstd;
        precompressed gz;
        root testdata;
    }

    # ── gunzip: inflate gzip bodies for clients that can't accept them ──
    # `gunzip on;` belongs on the route that RECEIVES gzip (a proxied
    # upstream sending Content-Encoding: gzip); clients without
    # Accept-Encoding: gzip then get a plain body instead.
    # location /from-upstream { rewrite proxy; proxy_pass 127.0.0.1:9000; gunzip on; }
}
