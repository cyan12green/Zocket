# ──────────────────────────────────────────────────────────────
# 15-sni-vhosts.conf — Per-vhost certificates with SNI selection
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/15-sni-vhosts.conf run
# Test (one cert pair is committed in src/testdata/tls, so both vhosts
# use it here; swap in distinct pairs for real deployments):
#
#   curl -k --resolve a.example.com:8443:127.0.0.1 https://a.example.com:8443/
#   curl -k --resolve b.example.com:8443:127.0.0.1 https://b.example.com:8443/
#   curl -k --resolve other.example.com:8443:127.0.0.1 https://other.example.com:8443/
#
# Selection: exact server_name > *.suffix wildcard > default server.
# A matched vhost without credentials falls back to the first server
# whose tls block is complete, so the mixed case keeps handshaking.
# ──────────────────────────────────────────────────────────────

# Global fallback pair (used by vhosts without their own tls block).
tls {
    cert src/testdata/tls/server-cert.pem;
    key  src/testdata/tls/server-key.pem;
}

server {
    listen 8443;
    server_name a.example.com;

    # Per-vhost override.
    tls {
        cert src/testdata/tls/server-cert.pem;
        key  src/testdata/tls/server-key.pem;
    }

    location / { return 200 "vhost a (/srv/a)\n"; }
}

server {
    listen 8443;
    server_name b.example.com;

    tls {
        cert src/testdata/tls/server-cert.pem;
        key  src/testdata/tls/server-key.pem;
    }

    location / { return 200 "vhost b (/srv/b)\n"; }
}

# Wildcard cert selection: *.api.example.com matches any subdomain.
server {
    listen 8443;
    server_name *.api.example.com;

    tls {
        cert src/testdata/tls/server-cert.pem;
        key  src/testdata/tls/server-key.pem;
    }

    location / { return 200 "api wildcard\n"; }
}

# No per-vhost tls block: falls back to the global pair above.
server {
    listen 8443;
    server_name c.example.com;

    location / { return 200 "vhost c inherits the global cert\n"; }
}

# Default server (no matching server_name): also the global pair.
server {
    listen 8443;

    location / { return 404 "unknown vhost\n"; }
}
