# ──────────────────────────────────────────────────────────────
# 11-full.conf — Comprehensive: all features in one config
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/11-full.conf run
# ──────────────────────────────────────────────────────────────

# ── Global limits ───────────────────────────────────────────
recv_buffer_size 16k;
send_buffer_size 16k;
max_body 16m;
max_line_bytes 8k;
max_headers 32;
max_chunked_body 64k;
connection_pool_max 1024;
client_header_timeout 10;
client_body_timeout 30;

# ── Static cache tuning ─────────────────────────────────────
static_cache_entries 16;
static_cache_valid 1;
static_content_cache_max 16k;

# ── Proxy cache sizing (defaults: 32 MiB, 256 entries) ─────

# ── Log format ──────────────────────────────────────────────
log_format combined "$ip - - [$date] \"$request\" $status";
log_format short "$request $status";

# ── Main server ─────────────────────────────────────────────
server {
    listen 8080;
    server_name app.example.com;

    tls {
        cert src/testdata/tls/server-cert.pem;
        key  src/testdata/tls/server-key.pem;
    }

    # ── Echo endpoint (testing) ─────────────────────────────
    location = /echo {
        content echo;
        access_log off;
    }

    # ── Health check (fixed response) ───────────────────────
    location = /health {
        return 200 "ok\n";
    }

    # ── Status page ─────────────────────────────────────────
    location = /status {
        content stub_status;
    }

    # ── Static files ────────────────────────────────────────
    location ^~ /static/ {
        content static;
        root testdata;
        index index.html;
        autoindex on;
        max_age 3600;
        add_header X-Static "true";
    }

    # ── Compressed static ───────────────────────────────────
    location /gz {
        content static;
        root testdata;
        precompressed gz;
    }

    # ── Gzip API ────────────────────────────────────────────
    location /api {
        content echo;
        gzip on;
        access_log combined;
    }

    # ── Reverse proxy with LB ───────────────────────────────
    location /proxy {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        balance least_connections;
        proxy_set_header X-Forwarded-For "$ip";
        proxy_set_header Host "$host";
        max_fails 3;
        fail_timeout 30;
    }

    # ── Cached proxy ────────────────────────────────────────
    location /cached {
        rewrite proxy;
        proxy_pass 127.0.0.1:9000;
        proxy_cache on;
        proxy_cache_valid 60;
        proxy_cache_stale_while_revalidate 30;
    }

    # ── Rate-limited endpoint ───────────────────────────────
    location /limited {
        content echo;
        limit_req rate=10 burst=20;
    }

    # ── Auth-protected area ─────────────────────────────────
    location /admin {
        content echo;
        auth_basic "Admin";
        auth_basic_user_file testdata/htpasswd;
    }

    # ── Auth via subrequest ─────────────────────────────────
    location /protected {
        content echo;
        auth_request /auth;
    }

    location = /auth {
        rewrite proxy;
        proxy_pass 127.0.0.1:9100;
    }

    # ── Connection-limited downloads ────────────────────────
    location /download {
        content static;
        root testdata;
        limit_conn 100;
    }

    # ── Custom headers ──────────────────────────────────────
    add_header X-Request-ID "$date";

    location /headers-demo {
        content echo;
        add_header X-Extra "yes";
        set_header Cache-Control "no-store";
        remove_header Server;
    }

    # ── Regex route with captures ───────────────────────────
    location ~ ^/users/([0-9]+)/ {
        content echo;
        set $user_id "$1";
    }

    # ── Catch-all echo ──────────────────────────────────────
    location / {
        content echo;
        gzip on;
    }
}

# ── Catch-all server (unmatched Host) ───────────────────────
server {
    listen 8080;

    location / {
        return 404 "no vhost matched\n";
    }
}
