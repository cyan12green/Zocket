# ──────────────────────────────────────────────────────────────
# 05-proxy-cache.conf — Response caching with stale-while-revalidate
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/05-proxy-cache.conf run
# Test:   curl -v http://localhost:8080/api/data  # first request → MISS
#         curl -v http://localhost:8080/api/data  # second → HIT
# ──────────────────────────────────────────────────────────────

# Cache zone sizing (global limits)
proxy_cache_max_bytes 32m;           # mmap zone size for cache entries
proxy_cache_max_entries 256;         # max distinct URL cache slots

server {
    listen 8080;

    # Cache API responses for 60s with 30s stale-while-revalidate
    location /api {
        rewrite proxy;
        proxy_pass 127.0.0.1:9000;
        proxy_cache on;              # bind proxy_cache + proxy_cache_store
        proxy_cache_valid 60;        # fresh for 60 seconds
        proxy_cache_stale_while_revalidate 30;  # serve stale for 30s while revalidating
    }

    # Short cache (10s) with default stale behavior
    location /short {
        rewrite proxy;
        proxy_pass 127.0.0.1:9000;
        proxy_cache on;
        proxy_cache_valid 10;
    }

    # No cache — passthrough
    location /nocache {
        rewrite proxy;
        proxy_pass 127.0.0.1:9000;
        # no proxy_cache directive → direct passthrough
    }

    location / {
        content echo;
    }
}
