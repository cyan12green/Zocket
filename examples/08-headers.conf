# ──────────────────────────────────────────────────────────────
# 08-headers.conf — Response header manipulation
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/08-headers.conf run
# Test:   curl -v http://localhost:8080/
#
# Header ops are applied by the `headers` filter (post-access phase).
# By default they apply to 2xx/3xx/4xx responses. Use `always` flag
# to apply to ALL status codes including 5xx.
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # add_header: append a response header (does not overwrite existing)
    location /safe {
        content echo;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }

    # set_header: replace-or-append (same as add_header if header absent)
    location /controlled {
        content echo;
        set_header Cache-Control "no-store";
        set_header X-Custom "value1";
    }

    # remove_header: strip a header from the response
    location /clean {
        content echo;
        remove_header Server;
        remove_header X-Powered-By;
    }

    # Server-scope declarations: apply to all child locations
    # (declarations here inherit down unless overridden)
    add_header X-Request-ID "$date";

    location /with-inherited {
        content echo;
        # inherits X-Request-ID from server scope
        add_header X-Extra "yes";   # adds to inherited headers
    }

    location / {
        content echo;
    }
}
