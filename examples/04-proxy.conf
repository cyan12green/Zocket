# ──────────────────────────────────────────────────────────────
# 04-proxy.conf — Reverse proxy with load balancing
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/04-proxy.conf run
# Test:   curl http://localhost:8080/
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Single upstream
    location /single {
        rewrite proxy;               # bind proxy_cache handler (phase: rewrite)
        proxy_pass 127.0.0.1:9000;
    }

    # Multiple backends + round-robin (default)
    location /lb {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        upstream 10.0.0.3:8002;
        balance round_robin;
    }

    # Least-connections + custom header
    location /least {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        balance least_connections;
        proxy_set_header X-Forwarded-For "$ip";
        proxy_set_header X-Real-IP "$remote_addr";
    }

    # IP-hash sticky sessions
    location /sticky {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        balance ip_hash;
    }

    # Active health checks
    location /hc {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        health_check path=/health interval=5 rise=2 fall=3 timeout=1;
    }

    # Consistent-hash with custom cookie affinity
    location /ch {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        upstream 10.0.0.3:8002;
        balance consistent_hash;
        sticky_cookie backend_id;
        max_fails 5;
        fail_timeout 15;
    }

    # Least-time (fastest to last response time)
    location /fastest {
        rewrite proxy;
        upstream 10.0.0.1:8000;
        upstream 10.0.0.2:8001;
        balance least_time;
    }

    location / {
        content echo;
    }
}
