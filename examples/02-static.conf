# ──────────────────────────────────────────────────────────────
# 02-static.conf — Static file serving, directory listing
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/02-static.conf run
# Test:   curl http://localhost:8080/
#         curl http://localhost:8080/dir/
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Serve files from testdata/ directory
    location / {
        content static;
        root testdata;               # project-root-relative path
        index index.html;            # directory index file
        autoindex on;                # directory listing fallback
        max_age 3600;                # Cache-Control: max-age=3600
    }

    # Embed a file at compile time (zero runtime I/O)
    location = /embed {
        embed testdata/hello.txt;    # comptime @embedFile
    }
}
