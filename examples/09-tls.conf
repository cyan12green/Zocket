# ──────────────────────────────────────────────────────────────
# 09-tls.conf — TLS 1.3 with ECDSA certificates
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/09-tls.conf run
# Test:   curl -k https://localhost:8443/
#
# Zocket implements native TLS 1.3 (no OpenSSL dependency).
# Only ECDSA certificates are supported (RSA is rejected).
# ALPN advertises h2 + http1.1.
# ──────────────────────────────────────────────────────────────

server {
    listen 8443;

    tls {
        cert src/testdata/tls/server-cert.pem;   # ECDSA certificate
        key  src/testdata/tls/server-key.pem;    # ECDSA private key
    }

    location = /health {
        return 200 "ok\n";
    }

    location / {
        content echo;
    }
}

# HTTP server alongside TLS
server {
    listen 8080;

    location / {
        return 301 "https://localhost:8443/";
    }
}
