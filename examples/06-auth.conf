# ──────────────────────────────────────────────────────────────
# 06-auth.conf — Basic authentication + subrequest auth
# ──────────────────────────────────────────────────────────────
# Build:  zig build -Dconfig=examples/06-auth.conf run
# Test:   curl -u alice:password http://localhost:8080/admin
#
# htpasswd format: user:password (plaintext, {SHA}base64, or bcrypt)
# Lines starting with # are comments.
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;

    # Basic auth: requires Authorization header matching htpasswd file
    location /admin {
        content echo;
        auth_basic "Restricted Area";       # realm sent in WWW-Authenticate
        auth_basic_user_file testdata/htpasswd;  # comptime-embedded file
    }

    # Subrequest auth: forward auth decision to an auth service
    # The auth endpoint returns 200 (allow) or 401/403 (deny)
    location /protected {
        content echo;
        auth_request /auth;                 # internal auth subrequest endpoint
    }

    # Internal auth endpoint (not directly accessible by clients)
    location = /auth {
        rewrite proxy;
        proxy_pass 127.0.0.1:9100;
    }

    # Public: no auth required
    location / {
        content echo;
    }
}
