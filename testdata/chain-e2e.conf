# E2E fixture for same-phase module chains (nginx-style, declaration order).
# Exercised by hand with curl:
#   zig build -Dconfig=testdata/chain-e2e.conf -Doptimize=ReleaseSafe run -- --port 8090
#   curl -d STUB-MUST-NOT-APPEAR localhost:8090/chain/stub-first   -> stub_status page
#   curl -d ECHO localhost:8090/chain/echo-first                   -> echoes ECHO
#   curl -d FALLBACK localhost:8090/chain/fallback                 -> echoes FALLBACK
#   curl -d STUB localhost:8090/chain/static-then-stub             -> stub_status page

server {
    location = /chain/stub-first {
        content stub_status;
        content echo;
    }

    location = /chain/echo-first {
        content echo;
        content stub_status;
    }

    location = /chain/fallback {
        content static;
        content echo;
    }

    location = /chain/static-then-stub {
        content static;
        content stub_status;
    }
}
